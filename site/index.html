<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vereinsflieger REST API</title>
    <link rel="stylesheet" href="./swagger-ui.css" />
    <style>
      body {
        margin: 0;
      }

      .notice {
        padding: 1rem;
        background: #e8f1f9;
        font: 1rem system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="notice">Die API-Dokumentation ist schreibgeschützt. Browser-Anfragen sind deaktiviert.</div>
    <div id="swagger-ui"></div>
    <script src="./swagger-ui-bundle.js"></script>
    <script>
      SwaggerUIBundle({
        url: './openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        supportedSubmitMethods: [],
        validatorUrl: null,
      });
    </script>
  </body>
</html>
