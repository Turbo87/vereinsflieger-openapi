openapi: 3.1.2
info:
  title: Vereinsflieger REST API
  version: 0.20260911.0
servers:
  - url: https://www.vereinsflieger.de/interface/rest
    description: Vereinsflieger
  - url: https://www.flightcenterplus.de/interface/rest
    description: Flightcenter
externalDocs:
  description: Offizielle REST-API-Spezifikation (Anmeldung erforderlich)
  url: https://vereinsflieger.de/member/help/download?file=VereinsfliegerRestInterface.pdf
x-source-document-date: '2026-09-11'
tags:
  - name: Anmeldefunktionen
paths:
  /auth/accesstoken:
    get:
      operationId: getAccessToken
      summary: Sitzungsschlüssel anfordern
      description: |-
        Liefert das Accesstoken für alle weiteren Aufrufe

        Kunden von Vereinsflieger nutzen als Basisadresse https://www.vereinsflieger.de
        Flightcenter-Kunden verwenden https://www.flightcenterplus.de
      tags:
        - Anmeldefunktionen
      responses:
        '200':
          description: Accesstoken für alle weiteren Aufrufe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                httpstatuscode: 200
                accesstoken: example-access-token
          x-verification:
            basis: documentation
            observedAt: '2026-09-28'
  /auth/signin:
    post:
      operationId: signIn
      summary: Anmelden
      description: |-
        Anmeldung eines Benutzers

        Hinweis: Das Passwort muss vorher verschlüsselt werden:
                 md5(password)
        Hinweis: Die eindeutige cid wird nur benötigt, wenn der Benutzer in
        mehreren Vereinen existiert.

        Der für die Nutzung erforderliche appkey kann über die Stammdaten
        (Einstellungen => REST Interface) des Vereins erstellt werden. Die
        max. Anzahl an Requests (gemeint sind alle Aufrufe, die einem appkey
        zugeordnet werden) ist auf 500 je Tag limitiert. Die kommerzielle
        Nutzung der Schnittstelle ist grundsätzlich untersagt.
      tags:
        - Anmeldefunktionen
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Anmeldung erfolgreich. Keine Antwortdaten.
          x-verification:
            basis: documentation
        '403':
          description: Fehlerhafte Anmeldung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInErrorResponse'
          x-verification:
            basis: documentation
  /auth/signout/{accesstoken}:
    delete:
      operationId: signOut
      summary: Abmelden
      description: Benutzerabmeldung
      tags:
        - Anmeldefunktionen
      parameters:
        - name: accesstoken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Abmeldung erfolgreich
          x-verification:
            basis: documentation
  /auth/getuser:
    post:
      operationId: getUser
      summary: Benutzerinformationen
      description: Daten zum angemeldeten Benutzer ermitteln
      tags:
        - Anmeldefunktionen
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetUserRequest'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInformationResponse'
          x-verification:
            basis: documentation
        '401':
          description: Nicht Authentifiziert
          x-verification:
            basis: documentation
components:
  schemas:
    AccessTokenResponse:
      type: object
      required:
        - httpstatuscode
        - accesstoken
      properties:
        httpstatuscode:
          type: integer
          description: HTTP-Statuscode in der Antwort.
        accesstoken:
          type: string
          description: Accesstoken für alle weiteren Aufrufe.
    SignInRequest:
      type: object
      required:
        - accesstoken
        - username
        - password
        - appkey
      properties:
        accesstoken:
          type: string
          description: Zuvor angefordertes Accesstoken.
        username:
          type: string
          description: Benutzername.
        password:
          type: string
          description: MD5-Hash des Passworts.
        appkey:
          type: string
          description: Eindeutiger Applikationsschlüssel.
        cid:
          type: integer
          description: Eindeutige Nummer des Vereins. Nur erforderlich, wenn der Benutzer in mehreren Vereinen existiert.
        auth_secret:
          type: string
          description: Wert für die Zwei-Faktor-Authentifizierung.
    SignInErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Fehlerbeschreibung.
        need_2fa:
          type: integer
          description: 1, wenn der Benutzer die Zwei-Faktor-Authentifizierung aktiviert hat.
    GetUserRequest:
      type: object
      required:
        - accesstoken
      properties:
        accesstoken:
          type: string
    UserInformationResponse:
      type: object
      required:
        - uid
        - firstname
        - lastname
        - memberid
        - status
        - roles
        - sector
        - email
      properties:
        uid:
          type: integer
          description: Eindeutige Id im Vereinsflieger
        firstname:
          type: string
          description: Vorname
        lastname:
          type: string
          description: Nachname
        memberid:
          type: string
          description: Mitgliedsnr
        status:
          type: string
          description: Mitgliedsstatus
        roles:
          type: array
          description: Zugeordnete Rollen
          items:
            type: string
        sector:
          type: array
          description: Zugeordnete Sparte(n)
          items:
            type: string
        email:
          type: string
          description: E-Mail-Adresse
